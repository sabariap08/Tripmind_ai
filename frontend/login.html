<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TripMind AI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-wrap { min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
        .auth-card { width: 100%; max-width: 440px; }
        .auth-msg { min-height: 1.5rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-7-7 18-2.5-7.5L3 11z"></path></svg>
                </span>
                TripMind AI
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="navbar-links" id="navLinks">
                <a href="/">Home</a>
                <a href="/register.html" class="btn btn-primary btn-sm">Register Now</a>
            </div>
        </div>
    </nav>

    <div class="auth-wrap">
        <div class="card auth-card">
            <div class="card-header">
                <div class="card-title">Welcome back</div>
            </div>
            <div class="card-content">
                <div class="auth-msg" id="authMsg"></div>
                <form onsubmit="doLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input id="email" type="email" class="form-input" placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input id="password" type="password" class="form-input" placeholder="••••••••">
                    </div>
                    <button class="btn btn-primary w-full" type="submit">Sign In</button>
                </form>
                <p class="text-muted mt-4" style="text-align:center;">
                    New here? <a href="/register.html">Create an account</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        if (navToggle) navToggle.addEventListener('click', () => {
            const open = navLinks.classList.toggle('open');
            navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });

        async function msg(text, isError) {
            const el = document.getElementById('authMsg');
            el.textContent = text || '';
            el.style.color = isError ? 'var(--danger,#dc2626)' : 'var(--success,#16a34a)';
        }

        async function doLogin(e) {
            e.preventDefault();
            await msg('Signing in…');
            try {
                const res = await api.login({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value });
                await msg(res.message);
                location.href = roleLanding(res.user);
            } catch (err) {
                await msg(err.message, true);
            }
        }
    </script>
</body>
</html>
