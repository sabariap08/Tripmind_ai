<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips - TripMind AI</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand"><span>🧠</span> TripMind AI</a>
            <div class="navbar-links">
                <a href="/">Home</a>
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="planner.html">Plan Trip</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top:2rem;padding-bottom:4rem;">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 style="font-size:1.75rem;font-weight:700;">My Trips</h1>
                <p class="text-sm text-muted mt-1">Manage and track all your travel plans</p>
            </div>
            <div class="flex gap-2">
                <button class="btn btn-outline" onclick="loadDemoTrip()">Load Demo Trip</button>
                <a href="planner.html" class="btn btn-primary">+ New Trip</a>
            </div>
        </div>

        <div id="statsGrid" class="stats-grid hidden">
            <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Trips</div></div>
            <div class="stat-card"><div class="stat-value" id="statBooked" style="color:var(--emerald);">0</div><div class="stat-label">Booked</div></div>
            <div class="stat-card"><div class="stat-value" id="statPlanned" style="color:var(--primary);">0</div><div class="stat-label">Planned</div></div>
            <div class="stat-card"><div class="stat-value" id="statReplanning" style="color:var(--amber);">0</div><div class="stat-label">Replanning</div></div>
        </div>

        <div id="loading" class="text-center" style="padding:4rem;">
            <div class="spinner"></div>
            <p class="text-sm text-muted mt-2">Loading trips...</p>
        </div>

        <div id="emptyState" class="empty-state hidden">
            <h3>No trips yet</h3>
            <p>Start planning your first adventure!</p>
            <a href="planner.html" class="btn btn-primary">Plan a Trip</a>
        </div>

        <div id="tripsGrid" class="trips-grid hidden"></div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        async function loadTrips() {
            try {
                const trips = await api.getTrips();
                document.getElementById('loading').classList.add('hidden');
                if (!trips.length) {
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }
                document.getElementById('statsGrid').classList.remove('hidden');
                document.getElementById('tripsGrid').classList.remove('hidden');

                document.getElementById('statTotal').textContent = trips.length;
                document.getElementById('statBooked').textContent = trips.filter(t => t.status === 'BOOKED').length;
                document.getElementById('statPlanned').textContent = trips.filter(t => t.status === 'PLANNED').length;
                document.getElementById('statReplanning').textContent = trips.filter(t => t.status === 'REPLANNING').length;

                const grid = document.getElementById('tripsGrid');
                grid.innerHTML = trips.map(trip => `
                    <div class="card trip-card" onclick="window.location='trip.html?id=${trip._id}'">
                        <div class="card-content">
                            <div class="flex justify-between items-center">
                                <div class="trip-route">
                                    <span>${trip.origin}</span>
                                    <span class="arrow">→</span>
                                    <span>${trip.destination}</span>
                                </div>
                                ${getStatusBadge(trip.status)}
                            </div>
                            <div class="trip-meta">
                                <span>📅 ${formatDate(trip.startDate)} - ${formatDate(trip.endDate)}</span>
                                <span>👥 ${trip.travelers} traveler${trip.travelers > 1 ? 's' : ''}</span>
                                <span>🎨 ${trip.travelStyle}</span>
                            </div>
                            <div class="trip-cost">
                                <div>
                                    <div class="text-xs text-muted">Budget</div>
                                    <div class="font-bold">${formatCurrency(trip.budget)}</div>
                                </div>
                                ${trip.totalEstimatedCost ? `
                                <div style="text-align:right;">
                                    <div class="text-xs text-muted">Estimated</div>
                                    <div class="font-bold" style="color:var(--emerald);">${formatCurrency(trip.totalEstimatedCost)}</div>
                                </div>` : ''}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('loading').innerHTML = `<p class="text-muted">Error loading trips: ${e.message}</p>`;
            }
        }

        async function loadDemoTrip() {
            try {
                const result = await api.createTrip({
                    origin: 'Coimbatore', destination: 'New York',
                    startDate: '2026-03-15', endDate: '2026-03-22',
                    travelers: 2, budget: 150000, travelStyle: 'BALANCED',
                });
                await api.generatePlans(result.tripId);
                window.location = `trip.html?id=${result.tripId}`;
            } catch (e) {
                alert('Error creating demo trip: ' + e.message);
            }
        }

        loadTrips();
    </script>
</body>
</html>
